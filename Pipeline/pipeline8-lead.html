<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Pipeline z Formularzem</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 40px 20px;
        }

        .add-lead-btn {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background .2s;
        }

        .add-lead-btn:hover {
            background: #2980b9;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: fadeIn .2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #7f8c8d;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: .8rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: .9rem;
            color: #2c3e50;
            outline: none;
            transition: border-color .2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #3498db;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .btn-cancel {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #c0392b;
        }

        .btn-save:hover {
            background: #27ae60;
        }
    </style>
</head>

<body>
    <div class="wrapper"><button class="add-lead-btn" id="openModal"> Nowy lead</button>
        <div class="modal-overlay" id="modal">
            <div class="modal-box">
                <div class="modal-header">
                    <div class="modal-title">Dodaj nowy lead</div> <button class="close-btn" id="closeX">&times;</button>
                </div>
                <form id="leadForm">
                    <div class="form-group"> <label>NAZWA FIRMY / KLIENTA</label> <input type="text" placeholder="np. ACME Corp" required> </div>
                    <div class="form-row">
                        <div class="form-group"> <label>OSOBA DECYZYJNA</label> <input type="text" placeholder="Jan Kowalski" required> </div>
                        <div class="form-group"> <label>TELEFON</label> <input type="tel" placeholder="123-456-789"> </div>
                    </div>
                    <div class="form-group"> <label>ADRES E-MAIL</label> <input type="email" placeholder="kontakt@firma.pl" required> </div>
                    <div class="form-row">
                        <div class="form-group"> <label>ŹRÓDŁO POZYSKANIA</label> <select required>
                                <option value="">Wybierz...</option>
                                <option value="www">Formularz WWW</option>
                                <option value="meta">Meta Ads</option>
                                <option value="google">Google Ads</option>
                                <option value="recommendation">Polecenie</option>
                            </select> </div>
                        <div class="form-group"> <label>SZACWANA WARTOŚĆ (ZŁ)</label> <input type="number" placeholder="0.00" min="0" required> </div>
                    </div>
                    <div class="form-group"> <label>NOTATKI / WYMAGANIA KLIENTA</label> <textarea rows="3" placeholder="Wpisz szczegóły zapytania..."></textarea> </div>
                    <div class="form-actions"> <button type="button" class="btn-cancel" id="closeBtn">Anuluj</button> <button type="submit" class="btn-save">Zapisz lead</button> </div>
                </form>
            </div>
        </div>
    </div>
    <script>const m = document.getElementById('modal'), o = document.getElementById('openModal'), cX = document.getElementById('closeX'), cB = document.getElementById('closeBtn'), f = document.getElementById('leadForm'); const t = () => m.classList.toggle('active'); o.addEventListener('click', t); cX.addEventListener('click', t); cB.addEventListener('click', t); m.addEventListener('click', (e) => { if (e.target === m) t(); }); f.addEventListener('submit', (e) => { e.preventDefault(); alert('Lead został pomyślnie zapisany!'); t(); f.reset(); });</script>
</body>

</html>
