<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Sprzedażowy - 4 Etapy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 40px 20px;
        }

        /* Kontener dla 4 boksów */
        .pipeline-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            /* Wsparcie dla urządzeń mobilnych */
        }

        /* Styl pojedynczego boksu */
        .pipeline-box {
            flex: 1;
            min-width: 250px;
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #3498db;
            /* Kolor przewodni */
            transition: transform 0.2s;
        }

        .pipeline-box:hover {
            transform: translateY(-5px);
        }

        /* Indywidualne kolory góry boksów sugerujące postęp */
        .box-1 {
            border-top-color: #e67e22;
        }

        /* Lead */
        .box-2 {
            border-top-color: #f1c40f;
        }

        /* Kontakt */
        .box-3 {
            border-top-color: #3498db;
        }

        /* Oferta */
        .box-4 {
            border-top-color: #2ecc71;
        }

        /* Sukces */

        /* Nagłówek etapu */
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .step-number {
            font-size: 0.8rem;
            background: #eee;
            padding: 3px 8px;
            border-radius: 12px;
            color: #666;
            font-weight: bold;
        }

        .box-title {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        /* Statystyki / Zawartość */
        .box-content {
            color: #7f8c8d;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .deal-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="pipeline-container">

        <!-- Box 1 -->
        <div class="pipeline-box box-1">
            <div class="box-header">
                <h3 class="box-title">Kwalifikacja</h3>
                <span class="step-number">Etap 1</span>
            </div>
            <div class="box-content">
                <p>Nowe leady i zapytania ze strony www.</p>
                <span class="deal-count">12 szans</span>
            </div>
        </div>

        <!-- Box 2 -->
        <div class="pipeline-box box-2">
            <div class="box-header">
                <h3 class="box-title">Kontakt</h3>
                <span class="step-number">Etap 2</span>
            </div>
            <div class="box-content">
                <p>W trakcie rozmów i analizy potrzeb.</p>
                <span class="deal-count">7 szans</span>
            </div>
        </div>

        <!-- Box 3 -->
        <div class="pipeline-box box-3">
            <div class="box-header">
                <h3 class="box-title">Propozycja</h3>
                <span class="step-number">Etap 3</span>
            </div>
            <div class="box-content">
                <p>Oferty wysłane do klienta, negocjacje ceny.</p>
                <span class="deal-count">4 szanse</span>
            </div>
        </div>

        <!-- Box 4 -->
        <div class="pipeline-box box-4">
            <div class="box-header">
                <h3 class="box-title">Zamknięte</h3>
                <span class="step-number">Etap 4</span>
            </div>
            <div class="box-content">
                <p>Umowy podpisane, sukces sprzedażowy.</p>
                <span class="deal-count">18 sukcesów</span>
            </div>
        </div>

    </div>

</body>

</html>
